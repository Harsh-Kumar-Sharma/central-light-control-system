# Per-site settings read by deploy.sh. Edit these BEFORE running ./deploy.sh.
# The Admin user is created on first install only; it is NOT changed on later runs.
# Do not use spaces or the characters $ " ' \ ` in the username/password.

SITE_ADMIN_USERNAME="admin"
SITE_ADMIN_PASSWORD="ChangeMe@123"

# Port the web app listens on. 80 = open http://<machine-ip>/ with no port number.
FRONTEND_PORT=80
